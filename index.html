
<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Menu | Juniper & Grain</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header class="header">
    <div class="header-content">
      <img src="img/logo.png" alt="Juniper & Grain logo" class="logo">

      <nav>
        <a href="index.html">Home</a>
        <a href="#menu-section">Menu</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">FRESH • LOCAL • SEASONAL</p>
      <h1>Our Menu</h1>
      <p>Good food, made with fresh ingredients and a little love.</p>

  <footer>
    <p>&copy; 2026 Juniper & Grain. All rights reserved.</p>
    <p>Fresh food. Good company.</p>
